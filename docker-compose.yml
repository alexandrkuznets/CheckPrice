services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - 8000:8000
  celery:
    build: .
    restart: unless-stopped
    env_file: .env
    command: celery -A app.tasks worker -B -l info
  rabbitmq:
    image: rabbitmq:3.10.7-management
    container_name: rabbitmq
    restart: unless-stopped
    hostname: rabbitmq
    ports:
      - 15672:15672
      - 5672:5672
  postgres:
    image: postgres:16.14
    restart: unless-stopped
    env_file: .env
    ports:
      - 5432:5432
